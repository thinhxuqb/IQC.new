name: Build Windows EXE Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install All Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --save-dev electron@34.0.0 electron-builder@25.1.8

      - name: Configure Electron Files & Metadata
        run: |
          mkdir -p electron
          cat << 'EOF' > electron/main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1366,
              height: 850,
              minWidth: 1024,
              minHeight: 700,
              title: 'IQC by ThinhXu - Quản Lý Nội Kiểm ISO 15189',
              autoHideMenuBar: false,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            mainWindow.loadFile(path.join(__dirname, '../dist/index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          EOF

          cat << 'EOF' > electron-builder.json
          {
            "appId": "com.thinhxu.iqc",
            "productName": "IQC by ThinhXu",
            "directories": {
              "output": "dist-electron"
            },
            "files": [
              "dist/**/*",
              "electron/**/*"
            ],
            "extraMetadata": {
              "main": "electron/main.cjs"
            },
            "win": {
              "target": ["nsis", "portable"]
            },
            "nsis": {
              "oneClick": false,
              "allowToChangeInstallationDirectory": true,
              "createDesktopShortcut": true,
              "createStartMenuShortcut": true
            }
          }
          EOF

          node -e "
            const fs = require('fs');
            if (fs.existsSync('package.json')) {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.description = pkg.description || 'IQC by ThinhXu - Quản Lý Nội Kiểm Xét Nghiệm';
              pkg.author = pkg.author || 'ThinhXu';
              pkg.main = 'electron/main.cjs';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            }
          "

      - name: Build Web Application
        run: |
          npm run build

      - name: Build Windows .EXE Packages
        run: |
          npx electron-builder --win --x64 --publish never

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IQC-Windows-Installer
          path: dist-electron/*.exe

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
